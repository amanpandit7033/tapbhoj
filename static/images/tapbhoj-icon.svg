<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="TapBhoj icon">
  <defs>
    <linearGradient id="tb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283891"/>
      <stop offset="100%" stop-color="#141c46"/>
    </linearGradient>
    <linearGradient id="tb-dome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ac9bf"/>
      <stop offset="100%" stop-color="#15a9a0"/>
    </linearGradient>
  </defs>
  <title>TapBhoj icon</title>
  <rect width="120" height="120" rx="28" fill="url(#tb-bg)"/>
  <g transform="translate(0 5)">
    <!-- Contactless Tap Signals -->
    <g fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round">
      <path d="M29.4 54.3A40 40 0 0 1 90.6 54.3" opacity=".95"/>
      <path d="M20.2 46.6A52 52 0 0 1 99.8 46.6" opacity=".55"/>
    </g>
    <!-- Cloche Lid Handle -->
    <circle cx="60" cy="48.5" r="3.6" fill="url(#tb-dome)"/>
    <!-- Cloche Food Dome (Bhoj) -->
    <path d="M32 80A28 28 0 0 1 88 80Z" fill="url(#tb-dome)"/>
    <!-- Serving Tray / Base -->
    <rect x="22" y="84" width="76" height="6.5" rx="3.25" fill="#FFFFFF"/>
  </g>
</svg>
