{% extends 'base.html' %}
{% load static %}

{% block title %}Check Your Email - TapBhoj{% endblock %}

{% block content %}
<main class="min-h-screen flex flex-col justify-center items-center p-4 bg-[#f4f5f7]">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xs border border-slate-200/90 p-6 sm:p-8 text-center space-y-5">
    <div class="w-12 h-12 mx-auto rounded-2xl bg-primary-50 border border-primary-100 flex items-center justify-center text-primary-600 shadow-2xs">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
    </div>
    <div class="space-y-1.5">
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">Check Your Email</h1>
      <p class="text-xs text-slate-500 leading-relaxed">
        If an account exists with the email you entered, we have sent instructions to reset your password.
      </p>
    </div>
    <a href="{% url 'login' %}" class="inline-block text-xs font-semibold text-primary-600 hover:text-primary-700 hover:underline">
      &larr; Back to Sign In
    </a>
  </div>
</main>
{% endblock %}
