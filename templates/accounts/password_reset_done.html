{% extends 'base.html' %}

{% block title %}Reset Email Sent - TapBhoj{% endblock %}

{% block content %}
<main class="min-h-screen flex flex-col justify-center items-center p-4">
  <div class="w-full max-w-sm bg-tapbhoj-surface dark:bg-tapbhoj-surface-dark rounded-2xl shadow-sm border border-black/5 dark:border-white/10 p-6 sm:p-8 text-center space-y-5">
    <div class="w-12 h-12 mx-auto rounded-full bg-tapbhoj-brand/10 dark:bg-tapbhoj-accent/20 flex items-center justify-center text-tapbhoj-brand dark:text-tapbhoj-accent">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
    </div>
    <h1 class="text-xl font-bold font-heading text-tapbhoj-ink dark:text-tapbhoj-ink-dark">Check Your Email</h1>
    <p class="text-xs text-tapbhoj-muted dark:text-tapbhoj-muted-dark leading-relaxed">
      If an account exists with that email, we've sent password reset instructions. Please check your inbox and spam folder.
    </p>
    <a href="{% url 'login' %}" class="inline-block text-xs font-semibold text-tapbhoj-brand dark:text-tapbhoj-accent hover:underline">
      Return to Sign In
    </a>
  </div>
</main>
{% endblock %}
