{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - TapBhoj{% endblock %}

{% block content %}
<main class="min-h-screen flex flex-col justify-center items-center p-4 bg-[#f4f5f7]">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xs border border-slate-200/90 p-6 sm:p-8 space-y-6">
    
    <div class="text-center space-y-1.5">
      <div class="w-12 h-12 mx-auto rounded-xl bg-primary-50 border border-primary-100 flex items-center justify-center p-2 mb-2 shadow-2xs">
        <img src="{% static 'images/tapbhoj-icon.svg' %}" alt="TapBhoj" class="w-full h-full object-contain">
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Reset Password</h1>
      <p class="text-xs text-slate-500">Enter your registered email address to receive reset instructions</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div class="space-y-1.5">
        <label for="id_email" class="block text-xs font-bold uppercase tracking-wider text-slate-500">
          Email Address
        </label>
        <input 
          type="email" 
          name="email" 
          id="id_email" 
          required 
          autocomplete="email"
          placeholder="owner@restaurant.com"
          class="w-full text-sm rounded-xl px-3.5 py-2.5 bg-white border border-slate-200 text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-primary-600 focus:outline-none shadow-xs"
        >
      </div>

      <button 
        type="submit" 
        class="w-full min-h-[42px] py-2.5 px-4 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs shadow-xs active:scale-95 transition-all cursor-pointer"
      >
        Send Reset Link
      </button>

      <div class="text-center pt-2">
        <a href="{% url 'login' %}" class="text-xs font-medium text-slate-500 hover:text-slate-900 transition-colors">
          &larr; Back to Sign In
        </a>
      </div>
    </form>

  </div>
</main>
{% endblock %}
