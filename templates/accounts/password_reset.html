{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - TapBhoj{% endblock %}

{% block content %}
<main class="min-h-screen flex flex-col justify-center items-center p-4">
  <div class="w-full max-w-sm bg-tapbhoj-surface dark:bg-tapbhoj-surface-dark rounded-2xl shadow-sm border border-black/5 dark:border-white/10 p-6 sm:p-8 space-y-6">
    
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-bold font-heading text-tapbhoj-ink dark:text-tapbhoj-ink-dark">Reset Password</h1>
      <p class="text-xs text-tapbhoj-muted dark:text-tapbhoj-muted-dark">Enter your registered email address to receive reset instructions</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div class="space-y-1.5">
        <label for="id_email" class="block text-xs font-semibold uppercase tracking-wider text-tapbhoj-muted dark:text-tapbhoj-muted-dark">
          Email Address
        </label>
        <input 
          type="email" 
          name="email" 
          id="id_email" 
          required 
          autocomplete="email"
          class="w-full text-sm rounded-xl px-3.5 py-2.5 bg-tapbhoj-bg dark:bg-tapbhoj-bg-dark border border-black/10 dark:border-white/10 text-tapbhoj-ink dark:text-tapbhoj-ink-dark focus:ring-2 focus:ring-tapbhoj-brand dark:focus:ring-tapbhoj-accent focus:outline-none"
        >
      </div>

      <button 
        type="submit" 
        class="w-full min-h-[44px] py-3 px-4 rounded-xl bg-tapbhoj-brand dark:bg-tapbhoj-brand-dark text-tapbhoj-surface dark:text-tapbhoj-bg-dark font-bold font-heading text-sm shadow-md hover:opacity-95 active:scale-95 transition-all"
      >
        Send Reset Link
      </button>

      <div class="text-center pt-2">
        <a href="{% url 'login' %}" class="text-xs font-medium text-tapbhoj-muted dark:text-tapbhoj-muted-dark hover:text-tapbhoj-ink dark:hover:text-tapbhoj-ink-dark">
          ← Back to Sign In
        </a>
      </div>
    </form>

  </div>
</main>
{% endblock %}
