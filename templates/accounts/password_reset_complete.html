{% extends 'base.html' %}
{% load static %}

{% block title %}Password Changed - TapBhoj{% endblock %}

{% block content %}
<main class="min-h-screen flex flex-col justify-center items-center p-4 bg-[#f4f5f7]">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xs border border-slate-200/90 p-6 sm:p-8 text-center space-y-5">
    <div class="w-12 h-12 mx-auto rounded-2xl bg-emerald-50 border border-emerald-100 flex items-center justify-center text-emerald-600 shadow-2xs">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
    </div>
    <div class="space-y-1.5">
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">Password Changed</h1>
      <p class="text-xs text-slate-500 leading-relaxed">
        Your password has been set successfully. You can now log in with your new credentials.
      </p>
    </div>
    <a href="{% url 'login' %}" class="inline-block w-full min-h-[42px] py-2.5 px-4 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs shadow-xs active:scale-95 transition-all cursor-pointer">
      Sign In
    </a>
  </div>
</main>
{% endblock %}
