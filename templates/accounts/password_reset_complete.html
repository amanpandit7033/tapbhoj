{% extends 'base.html' %}

{% block title %}Password Reset Complete - TapBhoj{% endblock %}

{% block content %}
<main class="min-h-screen flex flex-col justify-center items-center p-4">
  <div class="w-full max-w-sm bg-tapbhoj-surface dark:bg-tapbhoj-surface-dark rounded-2xl shadow-sm border border-black/5 dark:border-white/10 p-6 sm:p-8 text-center space-y-5">
    <div class="w-12 h-12 mx-auto rounded-full bg-tapbhoj-veg/20 flex items-center justify-center text-tapbhoj-veg">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
    </div>
    <h1 class="text-xl font-bold font-heading text-tapbhoj-ink dark:text-tapbhoj-ink-dark">Password Changed</h1>
    <p class="text-xs text-tapbhoj-muted dark:text-tapbhoj-muted-dark leading-relaxed">
      Your password has been successfully reset. You can now sign in with your new credentials.
    </p>
    <a href="{% url 'login' %}" class="inline-block w-full min-h-[44px] py-3 px-4 rounded-xl bg-tapbhoj-brand dark:bg-tapbhoj-brand-dark text-tapbhoj-surface dark:text-tapbhoj-bg-dark font-bold font-heading text-sm shadow-md hover:opacity-95 transition-all">
      Sign In Now
    </a>
  </div>
</main>
{% endblock %}
